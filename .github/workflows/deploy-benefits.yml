# מעלה את מערכת ההטבות ל-GitHub Pages בכל דחיפה לענף הפיתוח.
#
# ההעלאה נעשית בדחיפת תוכן תיקיית benefits לענף gh-pages — המסלול
# שג'יטהאב מפעיל ממנו Pages אוטומטית. המסלול הישיר (actions/deploy-pages)
# נוסה ונכשל: לטוקן של ה-workflow אין הרשאה ליצור אתר Pages דרך ה-API.
name: Deploy benefits to Pages

on:
  push:
    branches: [claude/credit-card-benefits-system-tch69c]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: node benefits/test/engine.test.js && node benefits/test/capture.test.js

      - name: Publish benefits/ to gh-pages
        run: |
          cd benefits
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
