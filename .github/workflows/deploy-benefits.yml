# מעלה את מערכת ההטבות ל-GitHub Pages בכל דחיפה לענף הפיתוח.
# האתר מוגש מתיקיית benefits, כך שהמערכת נפתחת ישר בכתובת הראשית.
name: Deploy benefits to Pages

on:
  push:
    branches: [claude/credit-card-benefits-system-tch69c]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run engine tests
        run: node benefits/test/engine.test.js && node benefits/test/capture.test.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: benefits

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
